<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FinanceHub — Executive Wealth & Cash Flow Platform</title>
    <meta
      name="description"
      content="Privacy-first executive financial command center with local-only persistence, interactive Chart.js analytics, cash flow ledger, budgets, wealth projections, and native-grade PWA capabilities."
    />
    <meta property="og:title" content="FinanceHub — Executive Wealth & Cash Flow Platform" />
    <meta
      property="og:description"
      content="Privacy-first executive financial command center with local-only persistence, interactive Chart.js analytics, cash flow ledger, budgets, wealth projections, and native-grade PWA capabilities."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Native Meta Tags -->
    <meta name="theme-color" content="#090C10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanceHub" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Typography: Plus Jakarta Sans (Display) + DM Sans (Body) + JetBrains Mono (Tabular Figures) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash before React hydrates -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('financehub_v1_state');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.settings && parsed.settings.theme === 'light') {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 dark:bg-[#090C10] dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-600 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
